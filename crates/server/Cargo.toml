[package]
name = "oxevu-server"
version = "0.1.0"
edition = "2024"

[features]
torrent-spike = ["dep:tempfile"]

[[example]]
name = "torrent-spike"
path = "examples/torrent_spike.rs"
required-features = ["torrent-spike"]

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.6", features = ["fs"] }
regex = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
base64 = "0.22"
quick-xml = "0.38"
futures-util = "0.3"
sha2 = "0.10"
librqbit = { version = "=9.1.0", default-features = false, features = ["rust-tls"] }
tempfile = { version = "3", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
