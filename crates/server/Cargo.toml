[package]
name = "oxevu-server"
version.workspace = true
edition.workspace = true

[features]
torrent-spike = ["dep:librqbit", "dep:tempfile", "dep:axum"]

[[example]]
name = "torrent-spike"
path = "examples/torrent_spike.rs"
required-features = ["torrent-spike"]

[dependencies]
oxevu-api = { path = "../api" }
anyhow.workspace = true
tokio.workspace = true
librqbit = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
